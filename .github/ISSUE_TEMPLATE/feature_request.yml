name: Feature request
description: 教材に追加したいセクションや改善案を提案します
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景・課題
      description: どんな学習上の課題を解決したいですか？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 追加したいセクション、サンプル、演習など
    validations:
      required: true

  - type: dropdown
    id: scenario
    attributes:
      label: 関連セクション
      options:
        - Part 0: 基礎と環境準備
        - Part 1: コア機能
        - Part 2: スキルシステム
        - Part 3: フックと自動化
        - Part 4: メモリシステム
        - Part 5: MCP とエージェント
        - Part 6: 発展・応用
